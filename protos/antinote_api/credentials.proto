syntax = "proto3";
package antinote_api;

import "protos/antinote_api/workspace.proto";

message SerializedTokenCredentials {
  string username = 1;
  string token = 2;
  SerializedWorkspace workspace = 3;
  string base_url = 4;
  repeated string cookies = 5;
  string device_uuid = 6;
  string nav_identifier = 7;
}

message SerializedPasswordCredentials {
  string username = 1;
  string password = 2;
  SerializedWorkspace workspace = 3;
  string base_url = 4;
  repeated string cookies = 5;
  string device_uuid = 6;
  string nav_identifier = 7;
}