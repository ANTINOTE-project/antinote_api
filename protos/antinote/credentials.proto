syntax = "proto3";
package antinote;

import "protos/antinote/workspace.proto";

message SerializedTokenCredentials {
  string username = 1;
  string token = 2;
  SerializedWorkspace workspace = 3;
  string base_url = 4;
  repeated string cookies = 5;
  string device_uuid = 6;
  string nav_identifier = 7;
}